<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="380" viewBox="0 0 1024 380">
    <defs>
        <mask id="blueAreasMask">
            <!-- White background = show everything -->
            <rect width="1024" height="1024" fill="white" />
            <!-- Black areas = hide (bottom V and top V should NOT show blue) -->
            <polygon points="0,1024 512,512 1024,1024" fill="black" />
            <polygon points="0,0 512,512 1024,0" fill="black" />
        </mask>
    </defs>

    <!-- Icon Group: Scaled and Positioned -->
    <!-- Y Offset changed from -47 to 6 so the full top and bottom of the white circle do not clip -->
    <g transform="translate(90, 6) scale(0.36)">
        <!-- Layer 2: White circle background padding -->
        <circle cx="512" cy="512" r="489" fill="white" stroke="transparent" stroke-width="2.65" />

        <!-- Layer 3: Blue filled center circle -->
        <circle cx="512" cy="512" r="79" fill="#091C99" />

        <!-- Layer 4 & 5: WHITE rings FIRST (full circles, no mask) -->
        <circle cx="512" cy="512" r="211" fill="none" stroke="transparent" stroke-width="95" />
        <circle cx="512" cy="512" r="370" fill="none" stroke="transparent" stroke-width="95" />

        <!-- Layer 4 & 5: BLUE rings on top, masked to show only left and right sides -->
        <g mask="url(#blueAreasMask)">
            <circle cx="512" cy="512" r="211" fill="none" stroke="#091C99" stroke-width="95" />
            <circle cx="512" cy="512" r="370" fill="none" stroke="#091C99" stroke-width="95" />
        </g>
    </g>

    <!-- Text Group -->
    <!-- Y position shifted down by 53px (from 185 to 238) to remain perfectly centered with the new icon position -->
    <text x="510" y="238" font-family="&#39;Roboto&#39;,&#39;Helvetica&#39;,&#39;Arial&#39;,sans-serif" font-weight="400" font-size="170" fill="white" letter-spacing="-2">
    zigna
    </text>
</svg>
